<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum - Eventos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="logo-section">
                <img src="img/logo_spectrum.png" alt="Logo" class="header-logo">
                <div class="header-text">
                    <h1>SPECTRUM</h1>
                    <p>Connect & Thrive</p>
                </div>
            </div>
            <nav class="desktop-nav">
                <a href="home.html" class="nav-link">Home</a>
                <a href="notificacoes.html" class="nav-link">Notificações</a>
                <a href="eventos.html" class="nav-link active">Eventos</a> <a href="perfil.html" class="nav-link">Perfil</a>
                
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h2>Próximos Eventos</h2>
        <div class="events-list">
            <div class="event-card">
                <div class="event-date">
                    <span class="day">12</span>
                    <span class="month">DEZ</span>
                </div>
                <div class="event-details">
                    <h3>Workshop para Pais e Cuidadores</h3>
                    <p>Um encontro para trocar experiências sobre rotinas escolares.</p>
                    <button class="event-btn">Inscrever-se</button>
                </div>
            </div>
            <div class="event-card">
                <div class="event-date">
                    <span class="day">18</span>
                    <span class="month">DEZ</span>
                </div>
                <div class="event-details">
                    <h3>Piquenique Inclusivo no Parque</h3>
                    <p>Traga sua família para uma tarde sensorial ao ar livre.</p>
                    <button class="event-btn">Saiba mais</button>
                </div>
            </div>
        </div>
    </main>
    <script src="theme.js"></script>
</body>
</html>
