<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum - Editar Dados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="perfil.html" class="back-link">← Voltar</a>
            <div class="header-text">
                <h1>Seus Dados</h1>
                <p>Atualize suas informações</p>
            </div>
            <div style="width: 50px;"></div> <!-- Espaço para equilibrar -->
        </div>
    </header>

    <main class="main-content">
        <div class="form-card">
            <form id="edit-form">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="divider"></div>
                <h3>Alterar Senha (Opcional)</h3>

                <div class="input-group">
                    <label for="nova-senha">Nova Senha</label>
                    <input type="password" id="nova-senha" placeholder="Deixe em branco para manter a atual">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 20px;">Salvar Alterações</button>
            </form>
        </div>
    </main>

    <script>
        // 1. Carregar dados atuais ao abrir a página
        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
        
        if (usuarioLogado) {
            document.getElementById('nome').value = usuarioLogado.nome;
            document.getElementById('email').value = usuarioLogado.email;
        }

        // 2. Salvar novas informações
        document.getElementById('edit-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const novoNome = document.getElementById('nome').value;
            const novoEmail = document.getElementById('email').value;
            const novaSenha = document.getElementById('nova-senha').value;

            // Atualiza o objeto do usuário
            usuarioLogado.nome = novoNome;
            usuarioLogado.email = novoEmail;
            
            // Só muda a senha se a pessoa digitou algo
            if (novaSenha) {
                usuarioLogado.senha = novaSenha;
            }

            // Salva de volta no LocalStorage
            localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
            
            // Também precisamos atualizar a "chave" do usuário no banco geral (opcional, mas recomendado)
            // Para simplificar aqui, vamos focar no usuário logado:
            
            alert('Dados atualizados com sucesso!');
            window.location.href = 'perfil.html';
        });
    </script>
    <script src="theme.js"></script>
</body>
</html>
